config-version: 2

name: "retail_analytics"
version: "1.0.0"

profile: "matteo"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  retail_analytics:
    +schema: seed_feeds

models:
  retail_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table

flags:
  require_generic_test_arguments_property: true